name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build abi3 wheel with maturin-action
        uses: PyO3/maturin-action@ea5bac0f1ccd0ab11c805e2b804bfcb65dac2eab  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: auto

      - name: Install built wheel in clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl

      - name: Smoke test from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          python -c "import aegis, sys; print(aegis.__file__); sys.exit(not aegis.CORE_AVAILABLE)"
          aegis --version
          aegis doctor
          python -c "import numpy as np; from safetensors.numpy import save_file; save_file({'w': np.random.default_rng(0).normal(0, 0.02, (256, 256)).astype(np.float32)}, 'model.safetensors')"
          aegis scan model.safetensors

      - name: Upload wheel artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build sdist with maturin-action
        uses: PyO3/maturin-action@ea5bac0f1ccd0ab11c805e2b804bfcb65dac2eab  # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2
        with:
          files: dist/*
          generate_release_notes: true
