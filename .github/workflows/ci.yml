name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cargo Check
        run: cargo check --verbose
      - name: Cargo Unit Tests (entropy, byte lanes, bit planes, Benford)
        run: cargo test --no-default-features --verbose

  python-check:
    name: Python ${{ matrix.python-version }} Build & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      AEGIS_REQUIRE_CLAIMS: "1"  # a skipped test behind a README claim fails the build (tests/conftest.py)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment and install CPU-only PyTorch
        # Installed before the project so pip treats torch as satisfied and does not
        # pull the multi-GB CUDA build from PyPI.
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build native extension and install with dev and fuzzer extras
        run: |
          source venv/bin/activate
          pip install -e ".[dev,fuzzer,engines]"
      - name: Check torch is the CPU build
        run: |
          source venv/bin/activate
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print('torch', torch.__version__)"
      - name: Allow unprivileged user namespaces (so the fuzz sandbox tests run, not skip)
        # Ubuntu 24.04 restricts them through AppArmor; `unshare -rn` is the Linux sandbox.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true && echo "unshare -rn available"
      - name: Run test suite (CLI, exit codes, scanners, disarm, fuzzer, threat matrix, claims)
        run: |
          source venv/bin/activate
          pytest -v tests/

  macos-check:
    # The macOS sandbox (sandbox-exec) confines writes and process spawning; claim C14 is proved here.
    name: macOS Python 3.12 Build & Tests
    runs-on: macos-latest
    env:
      AEGIS_REQUIRE_CLAIMS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch, then the project with dev, fuzzer and engines extras
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,fuzzer,engines]"
      - name: Run test suite
        run: |
          source venv/bin/activate
          pytest -v tests/
