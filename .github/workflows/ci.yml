name: CI

# Job names are matched by branch protection (scripts/protect_main.sh). Keep them stable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs (tag in the comment); update them deliberately.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable  # required when pinned by SHA
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Set up Python (pyo3 build script)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: cargo test (entropy, byte lanes, bit planes, Benford)
        run: cargo test --no-default-features

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install linters and runtime dependencies (no torch, no compiled core)
        # Versions match the dev extra in pyproject.toml. mypy is configured to pass without the
        # optional dependencies, which is how contributors without torch run it.
        run: pip install ruff==0.16.9 mypy==2.4.0 "typer>=0.9.0" "rich>=13.0.0" "numpy>=1.24.0" "safetensors>=0.8,<0.9" "jinja2>=3.1"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy aegis
      - name: Check README claims table and benchmark register
        run: python scripts/claims.py

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      AEGIS_REQUIRE_CLAIMS: "1"  # a skipped test behind a README claim fails the build (tests/conftest.py)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # diff-cover compares with origin/main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable  # required when pinned by SHA
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create virtual environment and install CPU-only PyTorch
        # Installed before the project so pip treats torch as satisfied and does not
        # pull the multi-GB CUDA build from PyPI.
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build native extension and install with dev, fuzzer and engines extras
        run: |
          source venv/bin/activate
          pip install -e ".[dev,fuzzer,engines]"
      - name: Check torch is the CPU build
        run: |
          source venv/bin/activate
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print('torch', torch.__version__)"
      - name: Allow unprivileged user namespaces (so the fuzz sandbox tests run, not skip)
        # Ubuntu 24.04 restricts them through AppArmor; `unshare -rn` is the Linux sandbox.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true && echo "unshare -rn available"
      - name: Run test suite (CLI, exit codes, scanners, disarm, fuzzer, threat matrix, claims)
        if: matrix.python-version != '3.12'
        run: |
          source venv/bin/activate
          pytest -v tests/
      - name: Run test suite with coverage
        if: matrix.python-version == '3.12'
        # Coverage floor: 88.26% measured on this job (24 Oct 2026), rounded down. Ratchet up only, never lower.
        run: |
          source venv/bin/activate
          pytest -v tests/ --cov=aegis --cov-report=xml --cov-report=term --cov-fail-under=88
      - name: Diff coverage (new and changed lines must be at least 90% covered)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: |
          source venv/bin/activate
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

  test-no-torch:
    # Contributors without PyTorch must be able to run every test that does not need it.
    name: test (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable  # required when pinned by SHA
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project without PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engines]"
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - name: Run test suite (torch tests skip; nothing may fail at collection)
        run: pytest -v tests/

  macos:
    # The macOS sandbox (sandbox-exec) confines writes and process spawning; claim C14 is proved here.
    name: macos
    runs-on: macos-latest
    env:
      AEGIS_REQUIRE_CLAIMS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable  # required when pinned by SHA
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch, then the project with dev, fuzzer and engines extras
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,fuzzer,engines]"
      - name: Run test suite
        run: |
          source venv/bin/activate
          pytest -v tests/

  wheel:
    # Builds and installs the wheel the way a user gets it, then runs it outside the repo,
    # so a missing module or data file in the package fails here rather than for a user.
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable  # required when pinned by SHA
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: |
          pip install "maturin>=1.5,<2.0"
          maturin build --release --out dist
      - name: Install it in a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
      - name: Smoke test from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          python -c "import aegis, sys; print(aegis.__file__); sys.exit(not aegis.CORE_AVAILABLE)"
          aegis --version
          aegis doctor
          python -c "import numpy as np; from safetensors.numpy import save_file; save_file({'w': np.random.default_rng(0).normal(0, 0.02, (256, 256)).astype(np.float32)}, 'model.safetensors')"
          aegis scan model.safetensors
