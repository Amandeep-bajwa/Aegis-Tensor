[package]
name = "aegis_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"  # slice::as_chunks
description = "High-performance Rust static scanner for Aegis-Tensor"
license = "Apache-2.0"

[lib]
name = "aegis_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
memmap2 = "0.9"
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
half = "2.4"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
