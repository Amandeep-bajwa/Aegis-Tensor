[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "aegis-tensor"
version = "0.1.0"
description = "Adversarial security tool detecting Steganography and Sleeper Agent Trojans in safetensors AI models"
readme = "README.md"
requires-python = ">=3.10"  # safetensors 0.8 requires Python 3.10+
authors = [
    { name = "Aegis-Tensor Team" }
]
license = { text = "Apache-2.0" }
keywords = ["security", "ai-safety", "safetensors", "steganography", "trojans", "rust", "pyo3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "safetensors>=0.8,<0.9",
    "jinja2>=3.1",  # parses (never renders) GGUF chat templates
]

[project.optional-dependencies]
fuzzer = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=6.0",           # coverage gate in CI
    "diff-cover>=9.0",           # new code on a PR must be at least 90% covered
    "ruff==0.16.9",              # pinned: the lint job and local runs must agree
    "mypy==2.4.0",               # pinned for the same reason
    "maturin>=1.5.0",
    "py7zr>=1.0",  # lets tests (and users) inspect 7z-wrapped checkpoints
    "jsonschema[format]>=4.18",  # validates JSON and SARIF output in tests
    "onnx>=1.16",                # ONNX scanner tests (optional at runtime)
    "h5py>=3.10",                # legacy Keras HDF5 scanner tests (optional at runtime)
]
# Optional engines folded into the Aegis verdict (aegis/engines.py).
engines = [
    "fickling>=0.1.12",
    "modelscan>=0.8",
]
# Benchmarks in benchmarks/. backdoor_eval.py also needs tensorflow (Python 3.12 or older).
bench = [
    "huggingface_hub>=0.25",
    "transformers>=4.40",
    "pyarrow",
    "pillow",
    "adversarial-robustness-toolbox>=1.20",
]

[project.scripts]
aegis = "aegis.cli:app"

[tool.maturin]
module-name = "aegis.aegis_core"
features = ["pyo3/extension-module"]
python-source = "."

[tool.coverage.run]
source = ["aegis"]
# tests/test_cli.py runs the CLI as a subprocess; measure it there too. The sandboxed child
# gets a minimal environment (aegis/sandbox.py, _child_env), so it is not measured.
patch = ["subprocess"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Deliberate typography in terminal and Markdown output (info sign, multiplication sign, en dash).
allowed-confusables = ["ℹ", "×", "–"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as default values; these calls build immutable descriptors.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design (S101), and run the aegis CLI as a subprocess with fixed argument
# lists built from tmp_path (S603).
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The compiled core and optional dependencies, which may be absent (the lint job installs none of
# them). Everything else must resolve. transformers is optional too: only `aegis fuzz --hf-config`.
[[tool.mypy.overrides]]
module = [
    "aegis.aegis_core",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "onnx",
    "onnx.*",
    "h5py",
    "py7zr",
    "py7zr.*",
    "fickling",
    "fickling.*",
    "modelscan",
    "modelscan.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not network'"
